[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-maintainer"
version = "0.1.0"
description = "Macro event database: 3-table SQLite, CLI maintenance, FastAPI read API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mem0 = [
    "mem0ai",
    "chromadb",
    "openai",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
gui = [
    "customtkinter>=5.2",
]

[tool.setuptools.packages.find]
include = ["event_maintainer*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
